[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "card-vision"
version = "0.1.0"
description = "Production-grade, privacy-first financial card detection, rectification, and attribute extraction engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "card-vision Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.23.0",
    "opencv-python-headless>=4.7.0",
    "onnxruntime>=1.15.0",
    "pillow>=9.5.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.6.0",
    "ultralytics>=8.2.0",
]

[project.urls]
Homepage = "https://github.com/aksharprabhudesai/card-vision"
Repository = "https://github.com/aksharprabhudesai/card-vision"
Issues = "https://github.com/aksharprabhudesai/card-vision/issues"

[project.scripts]
card-vision = "card_vision.cli:main"

[tool.hatch.build]
artifacts = [
    "card_vision/weights/*.onnx",
]

[tool.hatch.build.targets.wheel]
packages = ["card_vision"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "onnxruntime.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=card_vision"
testpaths = ["tests"]
